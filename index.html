<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoodlum Asylum Media Player</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    font-family:'Orbitron', sans-serif;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background:
    radial-gradient(circle,#ff000055 1px, transparent 1px);
    background-size:40px 40px;
    animation:bgmove 20s linear infinite;
    z-index:-1;
}

@keyframes bgmove{
    0%{transform:translate(0,0);}
    100%{transform:translate(-200px,-200px);}
}

.player{
    width:450px;
    background:rgba(15,15,15,0.95);
    border:2px solid #ff0000;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 30px #ff0000aa;
}

.top{
    padding:20px;
    text-align:center;
    background:linear-gradient(90deg,#111,#1a0000,#111);
    border-bottom:2px solid #ff0000;
}

.logo{
    font-size:28px;
    color:#ff2a2a;
    letter-spacing:3px;
    text-shadow:0 0 10px red;
}

.sub{
    font-size:12px;
    color:#999;
    margin-top:5px;
}

.video-box{
    background:black;
}

video{
    width:100%;
    display:block;
}

.controls{
    padding:20px;
}

.song-title{
    font-size:18px;
    margin-bottom:15px;
    color:#ff4444;
    text-align:center;
}

.progress-container{
    width:100%;
    height:8px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:20px;
}

.progress{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#ff0000,#ff8800);
}

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:20px;
}

button{
    width:60px;
    height:60px;
    border:none;
    border-radius:50%;
    background:#111;
    color:#ff3333;
    font-size:22px;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 10px #ff000055;
}

button:hover{
    background:#ff0000;
    color:white;
    transform:scale(1.1);
    box-shadow:0 0 20px red;
}

.upload-section{
    text-align:center;
    margin-bottom:20px;
}

.upload-btn{
    display:inline-block;
    padding:12px 20px;
    border:2px solid red;
    border-radius:10px;
    color:white;
    cursor:pointer;
    transition:0.3s;
    background:#111;
}

.upload-btn:hover{
    background:red;
    box-shadow:0 0 15px red;
}

input[type=file]{
    display:none;
}

.volume{
    margin-top:10px;
}

input[type=range]{
    width:100%;
    accent-color:red;
}

.footer{
    text-align:center;
    padding:12px;
    font-size:11px;
    color:#666;
    border-top:1px solid #222;
}
</style>
</head>

<body>

<div class="player">

    <div class="top">
        <div class="logo">HOODLUM ASYLUM</div>
        <div class="sub">MEDIA PLAYER SYSTEM</div>
    </div>

    <div class="video-box">
        <video id="video"></video>
    </div>

    <div class="controls">

        <div class="song-title" id="mediaTitle">
            Upload Music or Video
        </div>

        <div class="upload-section">
            <label for="fileInput" class="upload-btn">
                ⬆ Upload Media
            </label>

            <input 
                type="file" 
                id="fileInput" 
                accept="audio/*,video/*"
            >
        </div>

        <div class="progress-container">
            <div class="progress" id="progress"></div>
        </div>

        <div class="buttons">
            <button onclick="rewind()">⏪</button>
            <button onclick="togglePlay()" id="playBtn">▶</button>
            <button onclick="forward()">⏩</button>
        </div>

        <div class="volume">
            <input 
                type="range" 
                min="0" 
                max="1" 
                step="0.01" 
                value="1" 
                onchange="setVolume(this.value)"
            >
        </div>

    </div>

    <div class="footer">
        HOODLUM ASYLUM MEDIA © 2026
    </div>

</div>

<script>
const video = document.getElementById("video");
const playBtn = document.getElementById("playBtn");
const progress = document.getElementById("progress");
const fileInput = document.getElementById("fileInput");
const mediaTitle = document.getElementById("mediaTitle");

function togglePlay(){

    if(video.src === "") return;

    if(video.paused){
        video.play();
        playBtn.innerHTML = "⏸";
    } else {
        video.pause();
        playBtn.innerHTML = "▶";
    }
}

function rewind(){
    video.currentTime -= 10;
}

function forward(){
    video.currentTime += 10;
}

function setVolume(value){
    video.volume = value;
}

video.addEventListener("timeupdate", () => {

    const percent = 
    (video.currentTime / video.duration) * 100;

    progress.style.width = percent + "%";
});

fileInput.addEventListener("change", function(){

    const file = this.files[0];

    if(file){

        const fileURL = URL.createObjectURL(file);

        video.src = fileURL;

        mediaTitle.innerHTML = file.name;

        video.play();

        playBtn.innerHTML = "⏸";
    }
});
</script>

</body>
</html>
